name: Keep Render Awake

# هر ۱۰ دقیقه به /health سرویس پینگ می‌زند تا سرویس رایگان Render خواب نرود.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        env:
          URL: https://pdf-translator-bot.onrender.com
        run: |
          for i in 1 2 3 4; do
            code=$(curl -s -o /tmp/h.json -w "%{http_code}" -m 90 "$URL/health" || true)
            echo "try $i -> HTTP $code"
            if [ "$code" = "200" ]; then cat /tmp/h.json; exit 0; fi
            sleep 25
          done
          echo "ping failed (cold start may be slow) — will retry next cycle"
          exit 0
